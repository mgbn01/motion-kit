<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<link rel="stylesheet" href="./tema.css">
<link rel="stylesheet" href="./estilo.css">
</head>
<body>
<div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-duration="16" data-fps="30">
  <!-- Cenas: uma <section class="cena clip"> por item de cenas.json, com data-start/data-duration iguais. -->
  <section id="abertura" class="cena clip" data-start="0" data-duration="4">
    <h1 class="titulo">Título da abertura</h1>
  </section>
  <img class="marca-fixa" src="./assets/marca/logo-clara.png" alt="">
  <div class="assinatura">ASSINATURA</div>
</div>
<script src="./assets/vendor/gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#abertura .titulo', { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: 'power3.out' }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;
</script>
</body>
</html>
